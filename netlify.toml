[build]
  command = "npm run build"
  publish = ".next"
  environment = { NEXT_PUBLIC_BUILD = "true" }

# Bypass the Next.js runtime's /_next/image handler (returns 400 for these
# photos) and serve the same transforms from Netlify's Image CDN directly.
# Query params (url, w, q) are forwarded to the destination automatically.
[[redirects]]
  from = "/_next/image"
  to = "/.netlify/images"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/"
  status = 200
  force = false

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/photos/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/mp3/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
